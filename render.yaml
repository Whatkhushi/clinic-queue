# Render Blueprint: Render reads this file to create the web service.
# The database lives on Neon (free Postgres); paste its URL as DATABASE_URL
# when Render asks for it.
services:
  - type: web
    name: clinic-queue
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # you'll be prompted for it
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: CLINIC_TZ
        value: Asia/Kolkata
      - key: SEED_DEMO
        value: 'true'
